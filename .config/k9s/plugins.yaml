# Removes all finalizers from the selected resource. Finalizers are namespaced keys that tell Kubernetes to wait
# until specific conditions are met before it fully deletes resources marked for deletion.
# Before deleting an object you need to ensure that all finalizers has been removed. Usually this would be done
# by the specific controller but under some circumstances it is possible to encounter a set of objects blocked
# for deletion.
# This plugin makes this task easier by providing a shortcut to directly removing them all.
# Be careful when using this plugin as it may leave dangling resources or instantly deleting resources that were
# blocked by the finalizers.
# Author: github.com/jalvarezit
plugins:
  gpu-nodes:
    shortCut: g
    description: "Show available GPUs on nodes"
    scopes:
      - nodes
    background: false
    command: bash
    args:
      - -c
      - 'kubectl get nodes -o custom-columns="NAME:.metadata.name,GPU_Allocatable:.status.allocatable.amd\.com/gpu,GPU_Capacity:.status.capacity.amd\.com/gpu" | less'

  remove_finalizers:
    shortCut: Ctrl-F
    confirm: true
    dangerous: true
    scopes:
      - all
    description: |
      Removes all finalizers
    command: kubectl
    background: true
    args:
      - patch
      - --context
      - $CONTEXT
      - --namespace
      - $NAMESPACE
      - $RESOURCE_NAME.$RESOURCE_GROUP
      - $NAME
      - -p
      - '{"metadata":{"finalizers":null}}'
      - --type
      - merge
  debug:
    shortCut: Shift-D
    description: Add debug container
    dangerous: true
    scopes:
      - containers
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - "kubectl --kubeconfig=$KUBECONFIG debug -it --context $CONTEXT -n=$NAMESPACE $POD --target=$NAME --image=nicolaka/netshoot:v0.13 --share-processes -- bash"

  argocd:
    shortCut: "s"
    description: Sync ArgoCD Application
    scopes:
      - application
    command: argocd
    args: 
    - app
    - sync
    - $NAME
    - --app-namespace
    - $NAMESPACE
    background: true
    confirm: true
  apply:
    shortCut: Shift-E
    confirm: false
    background: false
    description: "Apply from editor"
    scopes:
      - all
    command: bash
    args:
      - -c
      - "vim /tmp/k8s.yaml && cat /tmp/k8s.yaml | kubectl -n $NAMESPACE apply -f -"
